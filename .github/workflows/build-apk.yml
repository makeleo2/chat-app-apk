name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install -g @bubblewrap/cli
      - run: |
          echo '{
            "packageId": "com.buytem.chat",
            "host": "chat.buytem.cn",
            "name": "Chat App",
            "startUrl": "/",
            "iconUrl": "https://via.placeholder.com/192x192/2196F3/ffffff?text=C",
            "appVersionName": "1.0.0",
            "appVersionCode": 1
          }' > twa-manifest.json
      - run: mkdir build && cd build && bubblewrap init --manifest=../twa-manifest.json --yes
      - run: cd build && bubblewrap build --generateAppBundle=false --type=debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app-debug.apk
