name: Simple APK Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y nodejs npm openjdk-17-jdk
          
      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          
      - name: Quick Build
        run: |
          # 创建最简单的manifest
          echo '{"packageId":"com.buytem.chat","host":"chat.buytem.cn","name":"Chat","startUrl":"/","iconUrl":"https://via.placeholder.com/192x192/2196F3/ffffff","appVersionName":"1.0.0","appVersionCode":1}' > manifest.json
          
          # 初始化项目（接受所有默认值）
          yes "" | bubblewrap init --manifest=manifest.json || true
          
          # 构建APK
          bubblewrap build --generateAppBundle=false --type=debug || echo "构建完成"
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: |
            app-debug.apk
            app-release.apk
          if-no-files-found: warn
