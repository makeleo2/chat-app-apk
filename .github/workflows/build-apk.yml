name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        # 重要：这里没有 cache 配置！
        
    - name: Install Java JDK
      run: |
        sudo apt-get update
        sudo apt-get install -y default-jdk
        java -version
        
    - name: Install Bubblewrap CLI
      run: |
        npm install -g @bubblewrap/cli
        bubblewrap --version
        
    - name: Create TWA Manifest
      run: |
        echo "创建 TWA 配置文件..."
        cat > twa-manifest.json << 'EOF'
{
  "packageId": "com.buytem.chat",
  "host": "chat.buytem.cn",
  "name": "Chat应用",
  "launcherName": "Chat",
  "themeColor": "#2196F3",
  "backgroundColor": "#FFFFFF",
  "startUrl": "/",
  "iconUrl": "https://via.placeholder.com/192x192/2196F3/ffffff?text=Chat",
  "appVersionName": "1.0.0",
  "appVersionCode": 1,
  "orientation": "portrait",
  "enableNotifications": true,
  "webManifestUrl": "https://chat.buytem.cn/",
  "fallbackType": "customtabs"
}
EOF
        echo "TWA 配置文件已创建"
        
    - name: Initialize TWA Project
      run: |
        mkdir -p twa-build
        cd twa-build
        bubblewrap init --manifest=../twa-manifest.json --yes
        
    - name: Build APK
      run: |
        cd twa-build
        bubblewrap build --generateAppBundle=false --type=debug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: chat-app
        path: twa-build/app-debug.apk
        retention-days: 30
