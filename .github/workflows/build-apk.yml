name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk nodejs npm wget unzip
          npm install -g @bubblewrap/cli

      - name: Create Manifest
        run: |
          cat > manifest.json << 'EOF'
          {
            "packageId": "com.buytem.chat",
            "host": "chat.buytem.cn", 
            "name": "Chat App",
            "startUrl": "/",
            "iconUrl": "https://via.placeholder.com/192x192/2196F3/ffffff?text=C",
            "appVersionName": "1.0.0",
            "appVersionCode": 1
          }
          EOF

      - name: Initialize and Build
        run: |
          # 设置环境变量避免交互提示
          export BUBBLEWRAP_ALLOW_INSTALL_JDK=true
          export BUBBLEWRAP_ALLOW_DOWNGRADE_JDK=true
          
          mkdir -p build
          cd build
          # 使用yes命令自动回答所有提示
          yes | bubblewrap init --manifest=../manifest.json
          yes | bubblewrap build --generateAppBundle=false --type=debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app-debug.apk
